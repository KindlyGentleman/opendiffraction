# OpenDiffraction 3.1 - Full Production Benchmark Configuration
name: full
version: "3.1.0"
num_samples: 9600
samples_per_profile: 200
splits:
  train: 0.70
  valid: 0.15
  test: 0.15
profiles: all  # V01 to V48
output_dir: output_full
random_seed: 42
object_size: [64, 64]
detector_size: [512, 512]
chunk_size: 128
compression: gzip
compression_level: 4
export_cxi: true
export_tasks: true
