name: Lint and Code Hygiene

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Run Ruff check
      run: |
        ruff check opendiffraction/ tests/ --exit-zero
