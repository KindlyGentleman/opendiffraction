name: Tests and Scientific Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"


    - name: Run scientific unit tests
      run: |
        python -m pytest tests/ -v

    - name: Run quick generation smoke test
      run: |
        python -m opendiffraction generate --preset quick --output ./ci_output --seed 42
        python -m opendiffraction validate --dataset ./ci_output --reports-dir ./ci_reports
