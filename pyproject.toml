[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opendiffraction"
version = "3.0.0"
description = "Physics-based synthetic coherent diffraction dataset generator for phase retrieval benchmarking"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.9"
authors = [{ name = "Muhammad Kamal" }]
maintainers = [{ name = "Muhammad Kamal" }]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.8.0",
    "h5py>=3.7.0",
    "pandas>=1.4.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.64.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/KindlyGentleman/opendiffraction"
Repository = "https://github.com/KindlyGentleman/opendiffraction"
"Kaggle Dataset" = "https://www.kaggle.com/datasets/hamadmuhammadkamal/opendiffraction-synthetic-cdi"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "torch>=2.0.0",
]

[project.scripts]
opendiffraction = "opendiffraction.cli:main"

[tool.setuptools.packages.find]
include = ["opendiffraction*"]
